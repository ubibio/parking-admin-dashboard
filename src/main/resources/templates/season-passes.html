<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정기권관리 - 주차관리 대시보드</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
    <style>
        #seasonPassTable { font-size: .9rem; }
        #gateCheckList { max-height: 160px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: .375rem; padding: .5rem; }
        #bulkUploadErrorTable { font-size: .85rem; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/layout :: topbar(activeMenu='season-pass')}"></nav>

<main class="container-fluid px-3 px-md-4 py-4" id="seasonPassRoot">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item">Home</li>
            <li class="breadcrumb-item">정기권관리</li>
            <li class="breadcrumb-item active" aria-current="page">정기권 차량 등록 및 관리</li>
        </ol>
    </nav>

    <!-- 정기권 차량 검색 -->
    <section class="card mb-3">
        <div class="card-body">
            <form id="searchForm" class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="filterKeyword" class="form-label">검색어</label>
                    <input type="text" class="form-control" id="filterKeyword" placeholder="차량번호 / 차주명 / 연락처">
                </div>
                <div class="col-6 col-md-3">
                    <label for="filterStatus" class="form-label">상태</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">전체</option>
                        <option value="ACTIVE">사용중</option>
                        <option value="EXPIRING_SOON">만료예정</option>
                        <option value="EXPIRED">만료</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label for="filterPassType" class="form-label">구분</label>
                    <select class="form-select" id="filterPassType">
                        <option value="">전체</option>
                        <option value="MONTHLY">월정기권</option>
                        <option value="SEMI_ANNUAL">정육정기권</option>
                        <option value="RESIDENT_EMPLOYEE">입주민/임직원</option>
                        <option value="DAY">주간전용</option>
                        <option value="NIGHT">야간전용</option>
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <button type="submit" class="btn btn-primary w-100">검색</button>
                </div>
            </form>
        </div>
    </section>

    <!-- 정기권 리스트 -->
    <section class="card mb-3">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-primary btn-sm" id="newPassBtn">신규 정기권 등록</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="bulkExtendBtn">선택 연장</button>
                <button type="button" class="btn btn-outline-danger btn-sm" id="bulkDeleteBtn">선택 삭제</button>
                <button type="button" class="btn btn-outline-info btn-sm" id="bulkNotifyBtn">선택 알림발송</button>
            </div>
            <button type="button" class="btn btn-outline-success btn-sm" id="bulkUploadOpenBtn">정기권 등록 엑셀 업로드</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="seasonPassTable">
                <thead class="table-light">
                <tr>
                    <th><input type="checkbox" class="form-check-input" id="checkAll"></th>
                    <th>No</th>
                    <th>차량번호</th>
                    <th>차주명</th>
                    <th>연락처</th>
                    <th>정기권 종류</th>
                    <th>유효 시작일</th>
                    <th>유효 만료일</th>
                    <th>결제상태</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody id="seasonPassTableBody">
                <tr>
                    <td colspan="11" class="text-center text-muted py-4">검색 조건을 선택하고 검색 버튼을 눌러주세요.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white">
            <nav aria-label="정기권 리스트 페이지">
                <ul class="pagination pagination-sm justify-content-center mb-0" id="seasonPassPagination"></ul>
            </nav>
        </div>
    </section>

    <!-- 신규등록/수정 모달 -->
    <div class="modal fade" id="passFormModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <form id="passForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="passFormModalTitle">신규 정기권 등록</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="formPassId">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="formVehicleNo" class="form-label">차량번호</label>
                                <input type="text" class="form-control" id="formVehicleNo" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="formPassType" class="form-label">정기권 종류</label>
                                <select class="form-select" id="formPassType" required>
                                    <option value="MONTHLY">월정기권</option>
                                    <option value="SEMI_ANNUAL">정육정기권</option>
                                    <option value="RESIDENT_EMPLOYEE">입주민/임직원</option>
                                    <option value="DAY">주간전용</option>
                                    <option value="NIGHT">야간전용</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="formOwnerName" class="form-label">차주명</label>
                                <input type="text" class="form-control" id="formOwnerName" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="formPhone" class="form-label">연락처</label>
                                <input type="text" class="form-control" id="formPhone" placeholder="010-0000-0000" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="formValidFrom" class="form-label">유효 시작일</label>
                                <input type="date" class="form-control" id="formValidFrom" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="formValidTo" class="form-label">유효 만료일</label>
                                <input type="date" class="form-control" id="formValidTo" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="formPaymentStatus" class="form-label">결제상태</label>
                                <select class="form-select" id="formPaymentStatus" required>
                                    <option value="PAID">결제완료</option>
                                    <option value="FREE_APPROVED">무료승인</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">출입 가능 게이트 (미선택 시 전체 허용)</label>
                                <div id="gateCheckList" class="d-flex flex-wrap gap-3">
                                    <span class="text-muted small">게이트 목록을 불러오는 중...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 선택 연장 모달 -->
    <div class="modal fade" id="extendModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="extendForm">
                    <div class="modal-header">
                        <h5 class="modal-title">정기권 연장</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <p class="small text-muted">선택된 <span id="extendTargetCount">0</span>건을 연장합니다.</p>
                        <div class="mb-3">
                            <label class="form-label d-block">연장 방식</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="extendMode" id="extendModeMonths" value="MONTHS" checked>
                                <label class="form-check-label" for="extendModeMonths">기존 만료일에 개월 수 추가</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="extendMode" id="extendModeDate" value="DATE">
                                <label class="form-check-label" for="extendModeDate">새 만료일 지정</label>
                            </div>
                        </div>
                        <div class="mb-3" id="extendMonthsField">
                            <label for="extendMonths" class="form-label">연장 개월 수</label>
                            <input type="number" class="form-control" id="extendMonths" min="1" value="1">
                        </div>
                        <div class="mb-3 d-none" id="extendDateField">
                            <label for="extendNewValidTo" class="form-label">새 유효 만료일</label>
                            <input type="date" class="form-control" id="extendNewValidTo">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="submit" class="btn btn-primary">연장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 선택 알림발송 모달 -->
    <div class="modal fade" id="notifyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="notifyForm">
                    <div class="modal-header">
                        <h5 class="modal-title">만료알림 발송</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <p class="small text-muted">선택된 <span id="notifyTargetCount">0</span>건에 발송합니다.</p>
                        <div class="mb-3">
                            <label class="form-label d-block">발송 채널</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="notifyChannel" id="notifyChannelKakao" value="ALIM_TALK" checked>
                                <label class="form-check-label" for="notifyChannelKakao">알림톡</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="notifyChannel" id="notifyChannelSms" value="SMS">
                                <label class="form-check-label" for="notifyChannelSms">SMS</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="submit" class="btn btn-primary">발송</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 엑셀 업로드 모달 -->
    <div class="modal fade" id="bulkUploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">정기권 등록 엑셀 업로드</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <a href="/api/season-passes/excel-template" class="btn btn-outline-secondary btn-sm" id="excelTemplateLink">등록 양식 다운로드 (.xlsx)</a>
                    </div>
                    <div class="mb-3">
                        <label for="bulkUploadFile" class="form-label">업로드 파일 (.xlsx만 지원)</label>
                        <input type="file" class="form-control" id="bulkUploadFile" accept=".xlsx">
                    </div>
                    <div id="bulkUploadResultSummary" class="mb-2"></div>
                    <div class="table-responsive d-none" id="bulkUploadErrorWrap">
                        <table class="table table-sm table-bordered" id="bulkUploadErrorTable">
                            <thead class="table-light">
                            <tr>
                                <th>행</th>
                                <th>차량번호</th>
                                <th>오류 사유</th>
                            </tr>
                            </thead>
                            <tbody id="bulkUploadErrorTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" id="bulkUploadSubmitBtn">업로드</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 처리 결과 토스트 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
        <div id="seasonPassToast" class="toast align-items-center text-white border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="seasonPassToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="닫기"></button>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
$(function () {
    'use strict';

    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
    var csrfToken = $('meta[name="_csrf"]').attr('content');
    var PAGE_SIZE = 20;
    var currentPage = 0;

    var passTypeLabel = {
        MONTHLY: '월정기권', SEMI_ANNUAL: '정육정기권', RESIDENT_EMPLOYEE: '입주민/임직원',
        DAY: '주간전용', NIGHT: '야간전용'
    };
    var paymentStatusLabel = { PAID: '결제완료', FREE_APPROVED: '무료승인' };
    var passStatusLabel = { ACTIVE: '사용중', EXPIRING_SOON: '만료예정', EXPIRED: '만료' };

    function ajaxHeaders() {
        var headers = {};
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }
        return headers;
    }

    function showToast(message, isError) {
        var $toast = $('#seasonPassToast');
        $toast.removeClass('bg-success bg-danger').addClass(isError ? 'bg-danger' : 'bg-success');
        $('#seasonPassToastBody').text(message);
        var toast = bootstrap.Toast.getOrCreateInstance($toast[0], { delay: 4000 });
        toast.show();
    }

    function badgeClassForPassStatus(status) {
        if (status === 'EXPIRED') { return 'bg-secondary'; }
        if (status === 'EXPIRING_SOON') { return 'bg-warning text-dark'; }
        return 'bg-success';
    }

    function formatBulkResult(res) {
        var msg = '성공 ' + (res.successCount || 0) + '건';
        if (res.failed && res.failed.length > 0) {
            msg += ' / 실패 ' + res.failed.length + '건 (' +
                res.failed.map(function (f) { return f.passId + ': ' + f.message; }).join(', ') + ')';
        }
        return msg;
    }

    // ----- 검색 조건 -----
    function buildFilterParams() {
        return {
            keyword: $('#filterKeyword').val() || null,
            status: $('#filterStatus').val() || null,
            passType: $('#filterPassType').val() || null
        };
    }

    // ----- 목록 조회 -----
    function rowHtml(item, rowNo) {
        var $tr = $('<tr></tr>');
        var $checkTd = $('<td></td>');
        $('<input type="checkbox" class="form-check-input row-check">').val(item.passId).appendTo($checkTd);
        $tr.append($checkTd);
        $tr.append($('<td></td>').text(rowNo));
        $tr.append($('<td></td>').text(item.vehicleNo || '-'));
        $tr.append($('<td></td>').text(item.ownerName || '-'));
        $tr.append($('<td></td>').text(item.phone || '-'));
        $tr.append($('<td></td>').text(passTypeLabel[item.passType] || item.passType || '-'));
        $tr.append($('<td></td>').text(item.validFrom || '-'));
        $tr.append($('<td></td>').text(item.validTo || '-'));
        $tr.append($('<td></td>').text(paymentStatusLabel[item.paymentStatus] || item.paymentStatus || '-'));

        var $statusTd = $('<td></td>');
        $('<span class="badge"></span>')
            .addClass(badgeClassForPassStatus(item.passStatus))
            .text(passStatusLabel[item.passStatus] || item.passStatus || '-')
            .appendTo($statusTd);
        $tr.append($statusTd);

        var $manageTd = $('<td></td>').addClass('d-flex gap-1');
        $('<button type="button" class="btn btn-outline-primary btn-sm"></button>')
            .text('수정')
            .on('click', function () { openEditModal(item.passId); })
            .appendTo($manageTd);
        $('<button type="button" class="btn btn-outline-secondary btn-sm"></button>')
            .text('연장')
            .on('click', function () { openExtendModal([item.passId]); })
            .appendTo($manageTd);
        $tr.append($manageTd);

        return $tr;
    }

    function renderTable(items, page) {
        var $tbody = $('#seasonPassTableBody');
        $tbody.empty();
        $('#checkAll').prop('checked', false);
        if (!items || items.length === 0) {
            $tbody.append('<tr><td colspan="11" class="text-center text-muted py-4">조회 결과가 없습니다.</td></tr>');
            return;
        }
        items.forEach(function (item, idx) {
            $tbody.append(rowHtml(item, page * PAGE_SIZE + idx + 1));
        });
    }

    function renderPagination(totalCount, page) {
        var $pagination = $('#seasonPassPagination').empty();
        var totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));

        function pageItem(label, targetPage, disabled, active) {
            var $li = $('<li class="page-item"></li>');
            if (disabled) { $li.addClass('disabled'); }
            if (active) { $li.addClass('active'); }
            var $link = $('<a class="page-link" href="#"></a>').text(label);
            if (!disabled && !active) {
                $link.on('click', function (e) {
                    e.preventDefault();
                    currentPage = targetPage;
                    loadList();
                });
            }
            $li.append($link);
            return $li;
        }

        $pagination.append(pageItem('이전', page - 1, page <= 0, false));

        var startPage = Math.max(0, page - 4);
        var endPage = Math.min(totalPages - 1, startPage + 9);
        for (var p = startPage; p <= endPage; p++) {
            $pagination.append(pageItem(p + 1, p, false, p === page));
        }

        $pagination.append(pageItem('다음', page + 1, page >= totalPages - 1, false));
    }

    function loadList() {
        var params = $.extend({ page: currentPage, size: PAGE_SIZE }, buildFilterParams());
        $('#seasonPassTableBody').html('<tr><td colspan="11" class="text-center text-muted py-4">조회 중...</td></tr>');
        $.getJSON('/api/season-passes', params)
            .done(function (res) {
                renderTable(res.items, res.page || 0);
                renderPagination(res.totalCount || 0, res.page || 0);
            })
            .fail(function () {
                $('#seasonPassTableBody').html('<tr><td colspan="11" class="text-center text-danger py-4">목록을 불러오지 못했습니다.</td></tr>');
                showToast('정기권 목록 조회에 실패했습니다.', true);
            });
    }

    $('#searchForm').on('submit', function (e) {
        e.preventDefault();
        currentPage = 0;
        loadList();
    });

    // ----- 전체 선택 -----
    $('#checkAll').on('change', function () {
        $('.row-check').prop('checked', $(this).prop('checked'));
    });

    function selectedPassIds() {
        return $('.row-check:checked').map(function () { return Number($(this).val()); }).get();
    }

    // ----- 게이트 목록(출입 게이트 제한 체크박스) -----
    var gateListCache = null;

    function loadGateCheckList(preselectedGateIds) {
        var $list = $('#gateCheckList');
        var selected = preselectedGateIds || [];

        function render(gates) {
            $list.empty();
            if (!gates || gates.length === 0) {
                $list.append('<span class="text-muted small">등록된 게이트가 없습니다.</span>');
                return;
            }
            gates.forEach(function (gate) {
                var $wrap = $('<div class="form-check form-check-inline"></div>');
                var checked = selected.indexOf(gate.gateId) !== -1;
                $('<input class="form-check-input gate-check" type="checkbox">')
                    .val(gate.gateId).prop('checked', checked)
                    .attr('id', 'gateCheck-' + gate.gateId)
                    .appendTo($wrap);
                $('<label class="form-check-label"></label>')
                    .attr('for', 'gateCheck-' + gate.gateId)
                    .text(gate.gateName)
                    .appendTo($wrap);
                $list.append($wrap);
            });
        }

        if (gateListCache) {
            render(gateListCache);
            return;
        }
        $.getJSON('/api/dashboard/gates')
            .done(function (gates) {
                gateListCache = gates || [];
                render(gateListCache);
            })
            .fail(function () {
                $list.html('<span class="text-danger small">게이트 목록을 불러오지 못했습니다.</span>');
            });
    }

    function selectedGateIds() {
        return $('.gate-check:checked').map(function () { return Number($(this).val()); }).get();
    }

    // ----- 신규등록/수정 모달 -----
    function resetPassForm() {
        $('#passForm')[0].reset();
        $('#formPassId').val('');
        $('#formPassType').val('MONTHLY');
        $('#formPaymentStatus').val('PAID');
    }

    $('#newPassBtn').on('click', function () {
        resetPassForm();
        $('#passFormModalTitle').text('신규 정기권 등록');
        loadGateCheckList([]);
        bootstrap.Modal.getOrCreateInstance('#passFormModal').show();
    });

    // 수정: GET /{passId} 원본 조회 후 폼 채움
    function openEditModal(passId) {
        $.getJSON('/api/season-passes/' + passId)
            .done(function (detail) {
                resetPassForm();
                $('#passFormModalTitle').text('정기권 수정');
                $('#formPassId').val(passId);
                $('#formVehicleNo').val(detail.vehicleNo || '');
                $('#formOwnerName').val(detail.ownerName || '');
                $('#formPhone').val(detail.phone || '');
                $('#formPassType').val(detail.passType || 'MONTHLY');
                $('#formValidFrom').val(detail.validFrom || '');
                $('#formValidTo').val(detail.validTo || '');
                $('#formPaymentStatus').val(detail.paymentStatus || 'PAID');
                loadGateCheckList(detail.allowedGateIds || []);
                bootstrap.Modal.getOrCreateInstance('#passFormModal').show();
            })
            .fail(function () {
                showToast('정기권 원본 정보를 불러오지 못했습니다.', true);
            });
    }

    $('#passForm').on('submit', function (e) {
        e.preventDefault();
        var passId = $('#formPassId').val();
        var body = {
            vehicleNo: $('#formVehicleNo').val(),
            ownerName: $('#formOwnerName').val(),
            phone: $('#formPhone').val(),
            passType: $('#formPassType').val(),
            validFrom: $('#formValidFrom').val(),
            validTo: $('#formValidTo').val(),
            allowedGateIds: selectedGateIds(),
            paymentStatus: $('#formPaymentStatus').val()
        };
        var $btn = $(this).find('button[type="submit"]').prop('disabled', true);

        $.ajax({
            url: passId ? '/api/season-passes/' + passId : '/api/season-passes',
            type: passId ? 'PUT' : 'POST',
            headers: ajaxHeaders(),
            contentType: 'application/json',
            data: JSON.stringify(body)
        }).done(function () {
            showToast(passId ? '정기권이 수정되었습니다.' : '정기권이 등록되었습니다.', false);
            bootstrap.Modal.getInstance(document.getElementById('passFormModal')).hide();
            loadList();
        }).fail(function () {
            showToast('저장에 실패했습니다.', true);
        }).always(function () {
            $btn.prop('disabled', false);
        });
    });

    // ----- 선택 연장 -----
    var extendTargetIds = [];

    function openExtendModal(passIds) {
        if (!passIds || passIds.length === 0) {
            showToast('연장할 정기권을 선택해주세요.', true);
            return;
        }
        extendTargetIds = passIds;
        $('#extendTargetCount').text(passIds.length);
        $('#extendForm')[0].reset();
        $('#extendModeMonths').prop('checked', true);
        $('#extendMonthsField').removeClass('d-none');
        $('#extendDateField').addClass('d-none');
        bootstrap.Modal.getOrCreateInstance('#extendModal').show();
    }

    $('#bulkExtendBtn').on('click', function () {
        openExtendModal(selectedPassIds());
    });

    $('input[name="extendMode"]').on('change', function () {
        var isDate = $('#extendModeDate').is(':checked');
        $('#extendDateField').toggleClass('d-none', !isDate);
        $('#extendMonthsField').toggleClass('d-none', isDate);
    });

    $('#extendForm').on('submit', function (e) {
        e.preventDefault();
        var body = { passIds: extendTargetIds };
        if ($('#extendModeDate').is(':checked')) {
            body.newValidTo = $('#extendNewValidTo').val();
        } else {
            body.extendMonths = Number($('#extendMonths').val());
        }
        var $btn = $(this).find('button[type="submit"]').prop('disabled', true);

        $.ajax({
            url: '/api/season-passes/extend',
            type: 'POST',
            headers: ajaxHeaders(),
            contentType: 'application/json',
            data: JSON.stringify(body)
        }).done(function (res) {
            showToast('연장 처리: ' + formatBulkResult(res), res.failed && res.failed.length > 0);
            bootstrap.Modal.getInstance(document.getElementById('extendModal')).hide();
            loadList();
        }).fail(function () {
            showToast('연장 처리에 실패했습니다.', true);
        }).always(function () {
            $btn.prop('disabled', false);
        });
    });

    // ----- 선택 삭제 -----
    $('#bulkDeleteBtn').on('click', function () {
        var passIds = selectedPassIds();
        if (passIds.length === 0) {
            showToast('삭제할 정기권을 선택해주세요.', true);
            return;
        }
        if (!window.confirm('선택한 ' + passIds.length + '건을 삭제하시겠습니까?')) {
            return;
        }
        $.ajax({
            url: '/api/season-passes',
            type: 'DELETE',
            headers: ajaxHeaders(),
            contentType: 'application/json',
            data: JSON.stringify({ passIds: passIds })
        }).done(function (res) {
            showToast('삭제 처리: ' + formatBulkResult(res), res.failed && res.failed.length > 0);
            loadList();
        }).fail(function () {
            showToast('삭제 처리에 실패했습니다.', true);
        });
    });

    // ----- 선택 알림발송 -----
    var notifyTargetIds = [];

    function openNotifyModal(passIds) {
        if (!passIds || passIds.length === 0) {
            showToast('알림을 발송할 정기권을 선택해주세요.', true);
            return;
        }
        notifyTargetIds = passIds;
        $('#notifyTargetCount').text(passIds.length);
        $('#notifyForm')[0].reset();
        $('#notifyChannelKakao').prop('checked', true);
        bootstrap.Modal.getOrCreateInstance('#notifyModal').show();
    }

    $('#bulkNotifyBtn').on('click', function () {
        openNotifyModal(selectedPassIds());
    });

    $('#notifyForm').on('submit', function (e) {
        e.preventDefault();
        var body = {
            passIds: notifyTargetIds,
            channel: $('input[name="notifyChannel"]:checked').val()
        };
        var $btn = $(this).find('button[type="submit"]').prop('disabled', true);

        $.ajax({
            url: '/api/season-passes/notifications',
            type: 'POST',
            headers: ajaxHeaders(),
            contentType: 'application/json',
            data: JSON.stringify(body)
        }).done(function (res) {
            res.successCount = res.sentCount; // notifications 응답은 sentCount(요청/발송 필드명이 다름, successCount로 정규화)
            showToast('알림 발송: ' + formatBulkResult(res), res.failed && res.failed.length > 0);
            bootstrap.Modal.getInstance(document.getElementById('notifyModal')).hide();
            loadList();
        }).fail(function () {
            showToast('알림 발송에 실패했습니다.', true);
        }).always(function () {
            $btn.prop('disabled', false);
        });
    });

    // ----- 엑셀 업로드 -----
    $('#bulkUploadOpenBtn').on('click', function () {
        $('#bulkUploadFile').val('');
        $('#bulkUploadResultSummary').empty();
        $('#bulkUploadErrorWrap').addClass('d-none');
        $('#bulkUploadErrorTableBody').empty();
        bootstrap.Modal.getOrCreateInstance('#bulkUploadModal').show();
    });

    $('#bulkUploadSubmitBtn').on('click', function () {
        var fileInput = document.getElementById('bulkUploadFile');
        var file = fileInput.files && fileInput.files[0];
        if (!file) {
            showToast('업로드할 파일을 선택해주세요.', true);
            return;
        }
        if (!/\.xlsx$/i.test(file.name)) {
            showToast('.xlsx 파일만 업로드할 수 있습니다.', true);
            return;
        }

        var formData = new FormData();
        formData.append('file', file);

        var $btn = $(this).prop('disabled', true);
        $('#bulkUploadResultSummary').html('<span class="text-muted">업로드 중...</span>');

        $.ajax({
            url: '/api/season-passes/bulk-upload',
            type: 'POST',
            headers: ajaxHeaders(),
            data: formData,
            processData: false,
            contentType: false
        }).done(function (res) {
            $('#bulkUploadResultSummary').html(
                '전체 ' + res.totalRows + '행 중 성공 ' + res.successCount + '건, 실패 ' + res.failCount + '건'
            );
            var $errBody = $('#bulkUploadErrorTableBody').empty();
            if (res.errors && res.errors.length > 0) {
                res.errors.forEach(function (err) {
                    var $tr = $('<tr></tr>');
                    $tr.append($('<td></td>').text(err.rowNo));
                    $tr.append($('<td></td>').text(err.vehicleNo || '-'));
                    $tr.append($('<td></td>').text(err.message));
                    $errBody.append($tr);
                });
                $('#bulkUploadErrorWrap').removeClass('d-none');
            } else {
                $('#bulkUploadErrorWrap').addClass('d-none');
            }
            showToast('엑셀 업로드가 완료되었습니다.', res.failCount > 0);
            loadList();
        }).fail(function () {
            $('#bulkUploadResultSummary').html('<span class="text-danger">업로드에 실패했습니다.</span>');
            showToast('엑셀 업로드에 실패했습니다.', true);
        }).always(function () {
            $btn.prop('disabled', false);
        });
    });

    // ----- 초기 로드 -----
    loadList();
});
</script>
</body>
</html>
