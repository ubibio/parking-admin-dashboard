<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 - 주차관리 대시보드</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background-color: #f1f4f8;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            background-color: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }
        .login-brand {
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #0d6efd;
        }
    </style>
</head>
<body>
<div class="login-card">
    <p class="login-brand text-center mb-1">SMART PARKING</p>
    <h4 class="mb-4 text-center">관리자 로그인</h4>
    <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
    <form id="loginForm" autocomplete="off">
        <div class="mb-3">
            <label for="loginId" class="form-label">아이디</label>
            <input type="text" class="form-control" id="loginId" name="loginId" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(function () {
        var csrfToken = $('meta[name="_csrf"]').attr('content');
        var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

        $('#loginForm').on('submit', function (e) {
            e.preventDefault();
            $('#loginError').addClass('d-none').text('');

            var headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            $.ajax({
                url: '/api/auth/login',
                type: 'POST',
                headers: headers,
                data: {
                    loginId: $('#loginId').val(),
                    password: $('#password').val()
                }
            }).done(function (res) {
                window.location.href = res.redirectUrl;
            }).fail(function () {
                $('#loginError').removeClass('d-none').text('아이디 또는 비밀번호가 올바르지 않습니다.');
            });
        });
    });
</script>
</body>
</html>
