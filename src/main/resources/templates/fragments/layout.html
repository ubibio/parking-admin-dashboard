<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공통 레이아웃 프래그먼트 (직접 렌더링 대상 아님)</title>
</head>
<body>

<!--/*
    styles / topbar / scripts 3개 프래그먼트로 구성.
    사용 예 (화면 6-1~6-4 구현 시):
      <head> ... <th:block th:replace="~{fragments/layout :: styles}"></th:block>
      <body> 최상단   <nav th:replace="~{fragments/layout :: topbar(activeMenu='dashboard')}"></nav>
      </body> 직전    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    activeMenu 값: dashboard | inout | revenue | season-pass | equipment
*/-->

<th:block th:fragment="styles">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</th:block>

<nav th:fragment="topbar(activeMenu)" class="navbar navbar-expand-md navbar-light bg-white border-bottom shadow-sm">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold text-primary" href="/admin/dashboard">SMART PARKING</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topbarNav"
                aria-controls="topbarNav" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? 'active fw-semibold' : ''"
                       href="/admin/dashboard">대시보드</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'inout'} ? 'active fw-semibold' : ''"
                       href="/admin/parking-records">입출차관리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'revenue'} ? 'active fw-semibold' : ''"
                       href="/admin/revenue">매출정산</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'season-pass'} ? 'active fw-semibold' : ''"
                       href="/admin/season-passes">정기권관리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeMenu == 'equipment'} ? 'active fw-semibold' : ''"
                       href="#">장비시스템</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="adminMenuDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:text="${adminName != null ? adminName : '관리자'}">관리자</span> 관리자
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminMenuDropdown">
                        <li><button type="button" class="dropdown-item" id="adminLogoutBtn">로그아웃</button></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            var csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
            var csrfToken = /*[[${_csrf.token}]]*/ '';

            $('#adminLogoutBtn').on('click', function () {
                var headers = {};
                headers[csrfHeader] = csrfToken;

                $.ajax({
                    url: '/api/auth/logout',
                    type: 'POST',
                    headers: headers
                }).always(function () {
                    window.location.href = '/admin/login';
                });
            });
        });
    </script>
</th:block>

</body>
</html>
