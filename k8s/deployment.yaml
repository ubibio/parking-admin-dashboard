apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-admin-dashboard
  labels:
    app: parking-admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-admin-dashboard
  template:
    metadata:
      labels:
        app: parking-admin-dashboard
    spec:
      containers:
        - name: parking-admin-dashboard
          image: 192.168.45.91:31114/parking-admin-dashboard:5
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parking-admin-dashboard
spec:
  type: NodePort
  selector:
    app: parking-admin-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30091
