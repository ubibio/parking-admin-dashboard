apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-admin-dashboard
  labels:
    app: parking-admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parking-admin-dashboard
  template:
    metadata:
      labels:
        app: parking-admin-dashboard
    spec:
      containers:
        - name: parking-admin-dashboard
          image: 192.168.45.91:31114/parking-admin-dashboard:35
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: parking-admin-dashboard
spec:
  type: NodePort
  selector:
    app: parking-admin-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30091
